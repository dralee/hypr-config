# Kitty Session 配置文件
# 保存到 ~/.config/kitty/cmus-session.conf

# 设置布局为垂直分割
layout splits

# 第一个窗口 - cmus 主界面（上方，占60%）
launch --location=hsplit --cwd=~ cmus

# 第二个窗口 - 歌词显示（右下方，占20%）
launch --location=vsplit --cwd=~ bash -c 'while true; do python3 ~/.config/cmus/show_lyrics.py; sleep 1; done'

# 第三个窗口 - cava 波形显示（左下方，占20%）
launch --location=vsplit --cwd=~ cava
