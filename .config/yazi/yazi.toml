# config for yazi

[opener]
play = [
	{ run = 'mpv %s', orphan = true, for = "unix" },
	{ run = '"C:\Program Files\mpv.exe" %s', orphan = true, for = "windows" }
]
edit = [
	{ run = '${EDITOR:-vim} %s', block = true, for = "unix" },
	{ run = "%EDITOR% %s",  block = true, for = "windows" },
]
open = [
	{ run = 'xdg-open %s', desc = "Open" },
]
view = [
	{ run = 'feh %s', desc = "view image" },
]
pdf = [
    # orphan=true避免终端卡死
	{ run = 'zathura %s', orphan = true, desc = "open pdf" },
]
epub = [
	{ run = 'zathura %s', orphan = true, desc = "open epub" },
]
office = [
	{ run = 'libreoffice %s', orphan = true, desc = "office file" },
]

[open]
prepend_rules = [
	{ url = "*.json", use = "edit" },
	{ url = "*.txt", use = "edit" },

	# Multiple openers for a single rule
	{ url = "*.html", use = [ "open", "edit" ] },
	{ url = "*.md", use = [ "edit" ] },
	{ url = "*.sh", use = [ "edit" ] },  
	{ mime = "text/*", use = [ "edit" ] },
    # open
	{ url = "*.pdf", use = [ "pdf" ] },
	{ url = "*.epub", use = [ "epub" ] },
	{ url = "*.xls", use = [ "office" ] },
	{ url = "*.xlsx", use = [ "office" ] },
	{ url = "*.docx", use = [ "office" ] },
	{ url = "*.pptx", use = [ "office" ] },

	# video
	{ mime = "video/*", use = "play" },
	# image
	{ mime = "image/*", use = [ "view" ] },
]
append_rules = [
	{ url = "*", use = "binary" },
]


#[plugin]
#prepend_previewers = [
# { url = "*.gz", run = "zless-preview" },
#]
[plugin]
prepend_preloaders = [
    # Replace magick, image, video with mediainfo
    { mime = "{audio,video,image}/*", run = "mediainfo" },
    { mime = "application/subrip", run = "mediainfo" },
    # Adobe Illustrator, Adobe Photoshop is image/adobe.photoshop, already handled above
    { mime = "application/postscript", run = "mediainfo" },
  ]
prepend_previewers = [
	#{ mime = "application/{*zip,tar,bzip2,7z*,rar,xz,zstd,java-archive}", 	run  = "ouch" }, # ouch
	# piper for gz,xz
	{ url = "*.tar*", run = 'piper --format=name -- tar tf "$1"'}, # tar tf xxx
    { url = "*.csv", run = "rich-preview"}, # for csv files
    { url = "*.md", run = "rich-preview" }, # for markdown (.md) files
    { url = "*.rst", run = "rich-preview"}, # for restructured text (.rst) files
    { url = "*.ipynb", run = "rich-preview"}, # for jupyter notebooks (.ipynb)
    { url = "*.json", run = "rich-preview"}, # for json (.json) files
#    { url = "*.lang_type", run = "rich-preview"} # for particular language files eg. .py, .go., .lua, etc.

# zoom
#	{ mime = "image/{jpeg,png,webp}", run = "zoom 5"},

# Replace magick, image, video with mediainfo
    { mime = "{audio,video,image}/*", run = "mediainfo"},
    { mime = "application/subrip", run = "mediainfo" },
    # Adobe Illustrator, Adobe Photoshop is image/adobe.photoshop, already handled above
    { mime = "application/postscript", run = "mediainfo" },

]

[tasks]
image_alloc = 1073741824        # = 1024*1024*1024 = 1024MB



