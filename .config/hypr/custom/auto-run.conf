# auto run the app by hyprland
# exec or exec-once
# 2025.12.29 by dralee

#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

# exec-once = $terminal
# exec-once = nm-applet &
# exec-once = waybar & hyprpaper & firefox
exec-once = fcitx5 -d --replace
exec-once = waybar & mako & awww-daemon # & hyprpaper 

# clipboard change
#exec-once = wl-paste --watch cliphist store
exec-once = wl-paste -t text -w xclip -selection clipboard --watch cliphist store # wine clipboard

# usb
exec-once = udiskie &

# network connect mgr
exec-once = nm-applet


# awww wallpaper
exec-once = awww img "$HOME/.config/wallpapers/126901-ocean.jpg"


