windowrule = float, initialClass:^(org.gtk.*|GTK Application|org.example.*|org.lee.*)$
windowrule = float, initialClass:(clash-verge|gucharmap)
windowrule = float, initialClass:(microsoft-edge|google-chrome),title:(QEMU*|VM*)

# place on workspace
windowrule = workspace 2, initialClass:jetbrains-rider,initialTitle:(Welcome to JetBrains Rider)
windowrule = workspace 3, initialClass:google-chrome
windowrule = workspace 4, initialClass:(code|Code|code-url-handler)
windowrule = workspace 5, initialClass:(jetbrains-idea|spotify|org.telegram.desktop|jetbrains-studio)
windowrule = workspace 6, initialClass:jetbrains-datagrip
windowrule = workspace 7, initialClass:(Feishu|QQ|wechat|Typora)
windowrule = workspace 8, initialClass:(microsoft-edge|firefox)
windowrule = workspace 9, initialClass:(Postman|Redis Insight|RedisInsight)
windowrule = workspace 10, title:(Opera)

# dialog
windowrule = stayfocused, title:^(Open File)(.*)$
windowrule = stayfocused, title:^(Select a File)(.*)$
windowrule = stayfocused, title:^(Choose wallpaper)(.*)$
windowrule = stayfocused, title:^(Open Folder)(.*)$
windowrule = stayfocused, title:^(Save|Save As)(.*)$
windowrule = stayfocused, title:^(Library)(.*)$
windowrule = stayfocused, title:^(File Upload)(.*)$
windowrule = stayfocused, class:^(xdg-desktop-portal.*)$
windowrule = center, title:^(Open File)(.*)$
windowrule = center, title:^(Select a File)(.*)$
windowrule = center, title:^(Choose wallpaper)(.*)$
windowrule = center, title:^(Open Folder)(.*)$
windowrule = center, title:^(Save|Save As)(.*)$
windowrule = center, title:^(Library)(.*)$
windowrule = center, title:^(File Upload)(.*)$
windowrule = float, class:^(xdg-desktop-portal.*)$
windowrule = float,title:^(Open File)(.*)$
windowrule = float,title:^(Select a File)(.*)$
windowrule = float,title:^(Choose wallpaper)(.*)$
windowrule = float,title:^(Open Folder)(.*)$
windowrule = float,title:^(Save|Save As)(.*)$
windowrule = float,title:^(Library)(.*)$
windowrule = float,title:^(File Upload)(.*)$
#
# typora
windowrule = center, title:$, class:Typora
windowrule =float,title:$, class:Typora
windowrule = stayfocused, title:$, class:Typora

# flameshot
windowrule=noanim,class:^(flameshot)$
windowrule=float,class:^(flameshot)$
windowrule=syncfullscreen,class:^(flameshot)$
windowrule=monitor 0,class:^(flameshot)$
windowrule=move 0 0,class:^(flameshot)$




