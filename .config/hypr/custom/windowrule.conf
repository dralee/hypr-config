windowrule = opacity 0.9 0.95 0.9,initialClass:jetbrains-datagrip
windowrule = opacity 0.9 0.95 0.9,initialClass:pcmanfm
windowrule = opacity 0.9 0.95 0.9,initialClass:Redis Insight
windowrule = opacity 0.9 0.95 0.9,initialClass:Postman
windowrule = opacity 1.0 $^ 1.0 $^,initialClass:(microsoft-edge|google-chrome|Typora)
windowrule = opacity 1.0 $^ 1.0 $^,initialTitle:(Feishu|微信)
windowrule = tile, initialTitle:Navicat Premium   #navicat.exe
#windowrule = float, initialClass: ,initialTitle:(微信)
windowrule = float, initialTitle:(预览)
windowrule = tile, initialClass:wechat,initialTitle:微信
windowrule = float, initialClass:QQ,initialTitle:收藏
