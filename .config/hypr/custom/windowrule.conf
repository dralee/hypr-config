windowrule = float, initialClass:com.github.maoschanz.drawing
windowrule = float, initialClass:qalculate
windowrule = float, initialClass:org.kde.gwenview
windowrule = tile, initialTitle:网易云音乐
windowrule = float, initialTitle:Picture
windowrule = float, initialTitle:_crx_iahnhfdhidomcpggpaimmmahffihkfnj
windowrule = float, initialClass:org.dralee.*
windowrule = float, initialClass:(pcmanfm|Pcmanfm)
windowrule = float, initialTitle:DevTools
windowrule = float, initialClass:feathernotes
windowrule = float, initialClass:feh
#windowrule = center:1, initialClass:feh
windowrule = float, initialClass:libreoffice*
windowrule = tile, initialClass:Typora,initialTitle:^(Typora)$
windowrule = float, initialClass:Typora,initialTitle:^()$
windowrule = stayfocused, initialClass:Typora,initialTitle:^()$
windowrule = float, initialClass:org.telegram.desktop,initialTitle:^(Media viewer)$
windowrule = float, initialClass:(mpv|vlc)
windowrule = float, initialClass:(org.fcitx.fcitx5-config-qt)
