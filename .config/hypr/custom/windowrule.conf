$^=override
windowrule = syncfullscreen,initialTitle:网易云音乐
windowrule = opacity 0.9 0.95 0.9,initialClass:(Code|code)
windowrule = opacity 0.9 0.95 0.9,initialTitle:Visual Studio Code
windowrule = opacity 0.9 0.95 0.9,initialClass:(jetbrains-rider|jetbrains-goland)
