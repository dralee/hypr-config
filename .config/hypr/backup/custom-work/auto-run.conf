# auto run the app by hyprland
# exec or exec-once
# 2025.12.29 by dralee

#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

# exec-once = $terminal
# exec-once = nm-applet &
# exec-once = waybar & hyprpaper & firefox
exec-once = fcitx5 -d --replace
#exec-once = waybar & mako & awww-daemon # & hyprpaper 
exec-once = waybar & dunst & awww-daemon # & hyprpaper 
# clipboard change
#exec-once = wl-paste --watch cliphist store
exec-once = wl-paste -t text -w xclip -selection clipboard --watch cliphist store # wine clipboard
exec-once = wl-paste --type text --watch cliphist store # Stores only text data
exec-once = wl-paste --type image --watch cliphist store # Stores only image data

# share
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
# xdg
exec-once = $HOME/.config/hypr/scripts/xdg-desktop-portal.sh

# usb
exec-once = udiskie &

# network connect mgr
exec-once = nm-applet

# idle
exec-once=hypridle

# normal
exec-once = $HOME/Application/Typora-linux-x64/Typora --enable-features=UseOzonePlatform --ozone-platform=wayland --enable-wayland-ime
exec-once = $HOME/Application/QQ.AppImage --enable-features=UseOzonePlatform --ozone-platform=wayland --enable-wayland-ime
#exec-once = /opt/wechat/wechat %u #/usr/lib/wechat-universal/start.sh %u
exec-once = /usr/bin/wechat %u
exec-once = /usr/bin/feishu --enable-features=UseOzonePlatform --ozone-platform=wayland --enable-wayland-ime %U


# awww wallpaper
exec-once = awww img "$HOME/.config/wallpapers/126901-ocean.jpg"

# dbus monitor
exec-once = $HOME/.config/hypr/scripts/dbus-monitor/dbus-notification-monitor-linux-amd64 -c $HOME/.config/hypr/scripts/dbus-monitor/notification-monitor.conf 

