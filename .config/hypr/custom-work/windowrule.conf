$^=override

###################### opacity ######################
windowrule {
    name = syncfullscreen网易
    match:fullscreen = true
    match:initial_title = 网易云音乐
}
windowrule {
    name = code opacity rule
    opacity = 0.9 0.95 0.9
    match:initial_class = (Code|code)
    match:initial_title = Visual Studio Code
}
windowrule {
    name = code opacity rule
    opacity = 0.9 0.95 0.9
    match:initial_title = Visual Studio Code
}
windowrule {
    name = jetbrains opacity rule
    opacity = 0.8 0.85 0.8
    match:initial_class = (jetbrains-rider|jetbrains-goland|jetbrains-rustrover|jetbrains-studio|jetbrains-gateway)
}
windowrule {
    name = running devices opacity
    opacity = 1.0 1.0 1.0
    match:initial_class = (jetbrains-studio)
    match:title = (Running Devices*)
}
windowrule {
    name = idea opacity
    opacity = 0.9 0.95 0.9
    match:initial_class = jetbrains-idea
}
windowrule {
    name = datagrip opacity
    opacity = 0.9 0.95 0.9
    match:initial_class = jetbrains-datagrip
}
windowrule {
    name = pcmanfm opacity
    opacity = 0.9 0.95 0.9
    match:initial_class = pcmanfm
}
windowrule {
    name = RedisInsight opacity
    opacity = 0.9 0.95 0.9
    match:initial_class = Redis Insight
}
windowrule {
    name = Postman opacity
    opacity = 0.9 0.95 0.9
    match:initial_class = Postman
}
#windowrule {
#    name = chrome opacity
